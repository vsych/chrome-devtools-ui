<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome DevTools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Cpath d='M12 10l-6 6 6 6M20 10l6 6-6 6' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e3e6eb;
    --text: #1b1f24;
    --muted: #5f6672;
    --faint: #8a919c;
    --accent: #1a73e8;
    --accent-hover: #1765cc;
    --accent-soft: #e8f0fe;
    --ok: #188038;
    --off: #b0b6bf;
    --code-bg: #f1f3f6;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --surface-2: #1f2328;
      --border: #2a2f36;
      --text: #e6e8eb;
      --muted: #a0a7b1;
      --faint: #757d88;
      --accent: #8ab4f8;
      --accent-hover: #a7c7fa;
      --accent-soft: #1d2a3d;
      --ok: #5bb974;
      --off: #4a5059;
      --code-bg: #1f2328;
      --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo { width: 40px; height: 40px; flex: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .sub a { color: inherit; }
  .spacer { flex: 1; }

  .connect { display: flex; gap: 8px; }
  input[type=text] {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 190px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button, .btn {
    font: inherit; font-weight: 500; cursor: pointer; border-radius: 8px; padding: 7px 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  button:hover, .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #0b1a2e; } }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .endpoint {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
  }
  .ep-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .endpoint.offline .ep-head { border-bottom: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
  .online .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .ep-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
  .ep-browser { color: var(--muted); }
  .ep-remove { margin-left: auto; padding: 2px 8px; font-size: 12px; color: var(--faint); border-color: transparent; background: none; }

  .target { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .target + .target { border-top: 1px solid var(--border); }
  .fav {
    width: 20px; height: 20px; border-radius: 4px; flex: none; display: grid; place-items: center;
    background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 600; overflow: hidden;
  }
  .fav img { width: 16px; height: 16px; }
  .t-main { min-width: 0; flex: 1; }
  .t-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-url { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; flex: none;
    background: var(--surface-2); color: var(--muted); text-transform: lowercase;
  }
  .badge.page { background: var(--accent-soft); color: var(--accent); }
  .badge.node { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .more { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .more button { font-size: 12px; padding: 2px 8px; margin-left: 4px; }

  .empty { padding: 4px 16px 16px 34px; color: var(--muted); font-size: 13px; }
  .empty p { margin: 0 0 8px; }
  .cmd {
    display: flex; align-items: center; gap: 8px; background: var(--code-bg); border-radius: 8px;
    padding: 8px 8px 8px 12px; margin: 6px 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
  }
  .cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
  .cmd button { padding: 2px 8px; font-size: 12px; font-family: system-ui, sans-serif; }

  footer { margin-top: 32px; color: var(--faint); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: inherit; }

  @media (max-width: 640px) {
    header { flex-wrap: wrap; }
    .connect { width: 100%; }
    .connect input { flex: 1; width: auto; }
    .badge { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="10" fill="#1a73e8"/>
      <path d="M15 13l-7 7 7 7M25 13l7 7-7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>Chrome DevTools</h1>
      <div class="sub" id="version">Loading…</div>
    </div>
    <div class="spacer"></div>
    <form class="connect" id="connect">
      <input type="text" id="endpoint" placeholder="host:port" aria-label="Add debug endpoint" autocomplete="off" spellcheck="false">
      <button type="submit">Add</button>
    </form>
  </header>

  <main id="endpoints"></main>

  <footer>
    <span>Inspect pages in Chrome and processes in Node.js through a self-hosted DevTools frontend.</span>
    <a href="https://github.com/vsych/chrome-devtools-ui">GitHub</a>
    <a href="https://developer.chrome.com/docs/devtools">DevTools docs</a>
  </footer>
</div>

<script>
'use strict';
const PRIMARY_TYPES = new Set(['page', 'node', 'webview', 'other']);
const STORAGE_KEY = 'cdu.endpoints';
let showAll = false;
let lastRender = '';

function loadExtra() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
function saveExtra(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch {}
}

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function inspectUrl(t) {
  const params = new URLSearchParams({ws: location.host + t.wsPath});
  if (t.type === 'node') params.set('v8only', 'true');
  return `/${t.frontend}?${params}`;
}

function copyCmd(text) {
  const btn = el('button', {type: 'button', onclick: async () => {
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
    catch { btn.textContent = 'Select & copy'; }
    setTimeout(() => btn.textContent = 'Copy', 1500);
  }}, 'Copy');
  return el('div', {class: 'cmd'}, el('code', {}, text), btn);
}

function chromeCommand(port) {
  const ua = navigator.userAgent;
  const flags = `--remote-debugging-port=${port} --user-data-dir=/tmp/devtools-profile`;
  if (/Mac/.test(ua)) return `"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ${flags}`;
  if (/Windows/.test(ua)) return `chrome.exe --remote-debugging-port=${port} --user-data-dir=%TEMP%\\devtools-profile`;
  return `google-chrome ${flags}`;
}

function renderEndpoint(ep, removable) {
  const port = ep.endpoint.split(':').pop();
  const head = el('div', {class: 'ep-head'},
    el('span', {class: 'dot'}),
    el('span', {class: 'ep-name'}, ep.endpoint),
    el('span', {class: 'ep-browser'}, ep.online ? (ep.browser || 'Connected') : 'Not running'),
    removable ? el('button', {class: 'ep-remove', type: 'button', title: 'Remove', onclick: () => {
      saveExtra(loadExtra().filter(e => e !== ep.endpoint)); lastRender = ''; refresh();
    }}, 'Remove') : null);
  const box = el('section', {class: `endpoint ${ep.online ? 'online' : 'offline'}`}, head);

  if (!ep.online) {
    const empty = el('div', {class: 'empty'});
    if (port === '9229') {
      empty.append(el('p', {}, 'Start a Node.js process with the inspector enabled:'), copyCmd('node --inspect your-script.js'));
    } else {
      empty.append(el('p', {}, 'Start Chrome with remote debugging, or run this CLI with --launch:'),
        copyCmd(chromeCommand(port)), copyCmd('npx chrome-devtools-ui --launch'));
    }
    box.append(empty);
    return box;
  }

  const primary = ep.targets.filter(t => PRIMARY_TYPES.has(t.type));
  const rest = ep.targets.filter(t => !PRIMARY_TYPES.has(t.type));
  const shown = showAll ? [...primary, ...rest] : primary;
  if (!ep.targets.length) {
    box.append(el('div', {class: 'empty'}, el('p', {}, 'Connected, but there is nothing to inspect yet.')));
  }
  for (const t of shown) {
    const fav = el('span', {class: 'fav'});
    if (t.faviconUrl && /^(https?:|data:image\/)/.test(t.faviconUrl)) {
      const img = el('img', {src: t.faviconUrl, alt: '', referrerpolicy: 'no-referrer'});
      img.onerror = () => { fav.textContent = (t.title || '?')[0].toUpperCase(); img.remove(); };
      fav.append(img);
    } else {
      fav.textContent = t.type === 'node' ? 'JS' : (t.title || '?')[0].toUpperCase();
    }
    box.append(el('div', {class: 'target'},
      fav,
      el('div', {class: 't-main'},
        el('div', {class: 't-title', title: t.title}, t.title),
        el('div', {class: 't-url', title: t.url || ''}, t.url || t.description || '')),
      el('span', {class: `badge ${t.type}`}, t.type.replace(/_/g, ' ')),
      el('a', {class: 'btn primary', href: inspectUrl(t), target: '_blank', rel: 'noopener'}, 'Inspect')));
  }
  if (rest.length) {
    box.append(el('div', {class: 'more'},
      showAll ? 'Showing workers and extensions.' : `${rest.length} worker${rest.length === 1 ? '' : 's'} / extension target${rest.length === 1 ? '' : 's'} hidden.`,
      el('button', {type: 'button', onclick: () => { showAll = !showAll; lastRender = ''; refresh(); }}, showAll ? 'Hide' : 'Show')));
  }
  return box;
}

let info = null;
async function refresh() {
  try {
    const extra = loadExtra();
    const qs = extra.map(e => `endpoint=${encodeURIComponent(e)}`).join('&');
    const res = await fetch(`/api/targets${qs ? '?' + qs : ''}`, {cache: 'no-store'});
    const data = await res.json();
    const key = JSON.stringify(data) + showAll;
    if (key === lastRender) return;
    lastRender = key;
    const configured = new Set(info ? info.endpoints : []);
    // Online endpoints first, then offline ones.
    data.sort((a, b) => Number(b.online) - Number(a.online));
    document.getElementById('endpoints').replaceChildren(...data.map(ep => renderEndpoint(ep, !configured.has(ep.endpoint))));
  } catch (e) {
    document.getElementById('endpoints').replaceChildren(
      el('section', {class: 'endpoint offline'}, el('div', {class: 'ep-head'}, el('span', {class: 'dot'}), 'The chrome-devtools-ui server is not responding.')));
    lastRender = '';
  }
}

document.getElementById('connect').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('endpoint');
  let v = input.value.trim().replace(/^(wss?|https?):\/\//, '').replace(/\/.*$/, '');
  if (/^\d+$/.test(v)) v = `127.0.0.1:${v}`;
  if (!/^[^\s:]+:\d{1,5}$/.test(v)) { input.focus(); input.select(); return; }
  const list = loadExtra();
  if (!list.includes(v)) list.push(v);
  saveExtra(list);
  input.value = '';
  lastRender = '';
  refresh();
});

(async () => {
  try {
    info = await (await fetch('/api/info')).json();
    const d = info.devtools;
    const ver = document.getElementById('version');
    ver.replaceChildren();
    if (d && d.chromiumRevision) {
      ver.append('Chromium ', el('a', {href: `https://crrev.com/${d.chromiumRevision}`, target: '_blank', rel: 'noopener'}, `r${d.chromiumRevision}`));
      if (d.built) ver.append(` · built ${d.built.slice(0, 10)}`);
    } else {
      ver.append(`v${info.version}`);
    }
  } catch {}
  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
